services:
  - type: web
    name: agencia-de-tickets
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: agencia-de-tickets
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: agencia-tickets-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agencia-tickets-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: agencia-tickets-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: agencia-tickets-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agencia-tickets-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: agencia-tickets-db
    plan: free
    databaseName: agencia_tickets
    user: agencia_user
